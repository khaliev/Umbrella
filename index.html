<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Umbrella</title>
    <link rel="icon" type="image/x-icon" href="/Umbrella/images/favicon.png" />
    <link rel="stylesheet" href="/Umbrella/styles.css" />
    <script src="/Umbrella/config.js"></script>
    <script src="/Umbrella/app.js" defer></script>
  </head>
  <body>
    <header><h2>Umbrella - Paré à tout</h2></header>
    <main>
      <section class="greeting"><h3 id="greeting"></h3></section>

      <section class="weather">
        <div id="time-container">
          <p id="clock">--:--:--</p>
          <p id="date">-- -- ----</p>
        </div>

        <form id="weather-form">
          <input type="text" id="weather-input" placeholder="Votre ville" />
          <button type="submit">Recherchez</button>
        </form>

        <div id="weather-info">
          <h2 id="city-name">Chargement...</h2>
          <div class="weather-detail">
            <img id="weather-icon" src="" alt="Icône météo" />
            <p id="temperature">--°C</p>
          </div>
          <p id="weather-description">--</p>
        </div>
      </section>

      <section class="todolist">
        <form id="todo-form">
          <input type="text" name="task" id="task" />
          <button id="addTask">➕</button>
        </form>
        <ul id="todo-list"></ul>
      </section>
    </main>
    <footer class="footer">2026 © Umbrella - Paré à tout</footer>
  </body>
</html>
